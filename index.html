<!DOCTYPE HTML>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Railforth Prototype</title>
  <script src="./build/main.js"></script>
</head>

<body>
  <script>
    const storage = window.localStorage;
    let program = "";
    if (storage) {
      program = storage.getItem("program") || `(
操作：
ドラッグ / スワイプ → 回転
Shift+ドラッグ / 二本指スワイプ → 移動
マウスホイール / ピンチ操作 → 拡大縮小

* 2026/10/11 プラレールグレイコードカウンター
* 本プログラムはMITライセンスで提供されます。末尾のライセンス表示をご覧下さい。
)

: base
l r s
;

: floor
up
l l l l

s h
at ( binary の部分 )
  h
  at ( graycode の部分 )
    l .
  tl2
    tl1 .
    l l l l
    dn
    . ( 下に降りる )
  r r r r ( 上からくる部分に繋がる )

.
l l l
;

: roof
up
l l l l
s ss h
at ( 一番上のグレイコードの部分 )
  l .
r
tl1 . 
l l l l
dn
;

base  ( 0 )
floor ( 1 )
floor ( 2 )
floor ( 3 )
floor ( 4 )
floor ( 5 )
floor ( 6 )
floor ( 7 )
roof  ( 8 )

(

)  

  `      ;
    }

    var app = Elm.Main.init({
      flags: {
        program: program
      }
    });

    app.ports.save.subscribe(function (program) {
      const storage = window.localStorage;
      if (storage) {
        storage.setItem("program", program);
      }
    });
    app.ports.setPointerCaptureImpl.subscribe(function (event) {
      event.target.setPointerCapture(event.pointerId);
    });    
  </script>
</body>

</html>
